<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hum</title>
<style>
  :root { --bg:#0e0e11; --fg:#f2f0ea; --mute:#8d8a80; --acc:#ffb347; --card:#17171c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 20px 80px; }
  h1 { font-size:56px; margin:0 0 4px; letter-spacing:-0.03em; }
  .sub { color:var(--mute); margin:0 0 40px; }
  .card { background:var(--card); border-radius:16px; padding:24px; margin-bottom:20px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:0.08em; color:var(--mute); margin:0 0 14px; }
  button { font:inherit; border:0; border-radius:999px; padding:14px 26px; cursor:pointer; background:var(--acc); color:#000; font-weight:600; }
  button.rec { background:#e5484d; color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid #333; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  select { font:inherit; background:#222; color:var(--fg); border:1px solid #333; border-radius:10px; padding:10px 12px; }
  .prompt { font-family: ui-monospace, monospace; font-size:13px; color:#cfcbbf; background:#0a0a0c; border-radius:10px; padding:14px; white-space:pre-wrap; margin-top:14px; }
  .status { color:var(--mute); font-size:14px; min-height:20px; margin-top:12px; }
  .heard { color:var(--acc); font-style:italic; }
  audio { width:100%; margin-top:16px; }
  .meter { height:6px; background:#222; border-radius:3px; overflow:hidden; margin-top:12px; }
  .meter > div { height:100%; width:0; background:var(--acc); transition:width .1s; }
  .hidden { display:none; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { font-size:12px; color:var(--mute); border:1px solid #2a2a30; border-radius:999px; padding:4px 10px; }
</style>
</head>
<body>
<main>
  <h1>hum</h1>
  <p class="sub">Hum a melody. Get a track. Then tell it what to change.</p>

  <section class="card" id="step1">
    <h2>1 · Hum something</h2>
    <div class="row">
      <button id="humBtn">● Start humming</button>
      <select id="genre">
        <option>lo-fi hip hop</option>
        <option>indie folk</option>
        <option>synthwave</option>
        <option>jazz trio</option>
        <option>cinematic orchestral</option>
        <option>house</option>
        <option>bossa nova</option>
      </select>
    </div>
    <div class="meter"><div id="meter"></div></div>
    <div class="status" id="s1"></div>
    <div class="chips hidden" id="chips"></div>
    <div class="prompt hidden" id="prompt1"></div>
  </section>

  <section class="card hidden" id="step2">
    <h2>2 · Your track</h2>
    <div class="status" id="s2"></div>
    <audio id="player" controls></audio>
  </section>

  <section class="card hidden" id="step3">
    <h2>3 · Change it by talking</h2>
    <p style="color:var(--mute);margin:0 0 12px">Try: “slower and warmer”, “make it sad”, “swap in a piano”, “more epic”.</p>
    <div class="row">
      <button id="revBtn" class="ghost">🎙 Hold to speak</button>
      <button id="regenBtn" class="ghost">↻ Regenerate</button>
    </div>
    <div class="status" id="s3"></div>
    <div class="prompt hidden" id="prompt3"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let currentPrompt = "";

// ---------- recording helpers
async function record({ onLevel, until }) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const rec = new MediaRecorder(stream, { mimeType: "audio/webm" });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);

  // level meter
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  let raf;
  const tick = () => { an.getByteTimeDomainData(buf);
    let s=0; for (const v of buf) s += (v-128)**2;
    onLevel && onLevel(Math.min(1, Math.sqrt(s/buf.length)/40)); raf = requestAnimationFrame(tick); };
  tick();

  rec.start();
  await until();
  rec.stop();
  await new Promise(r => rec.onstop = r);
  cancelAnimationFrame(raf); ctx.close(); stream.getTracks().forEach(t => t.stop());
  onLevel && onLevel(0);
  return new Blob(chunks, { type: "audio/webm" });
}

// hold-to-record: resolves when the button is released
function holdOn(btn) {
  return () => new Promise(res => {
    const done = () => { btn.removeEventListener("mouseup", done); btn.removeEventListener("mouseleave", done); btn.removeEventListener("touchend", done); res(); };
    btn.addEventListener("mouseup", done); btn.addEventListener("mouseleave", done); btn.addEventListener("touchend", done);
  });
}

// ---------- step 1: hum → analyze → compose
let humming = false;
$("humBtn").onclick = async () => {
  if (humming) return;
  humming = true;
  const btn = $("humBtn");
  btn.textContent = "■ Stop (click when done)"; btn.classList.add("rec");
  const stopP = new Promise(r => { btn.onclick = () => r(); });

  const blob = await record({ onLevel: l => $("meter").style.width = (l*100)+"%", until: () => stopP });
  btn.textContent = "● Start humming"; btn.classList.remove("rec"); btn.onclick = arguments.callee;
  humming = false;

  $("s1").textContent = "Listening to your hum…";
  const fd = new FormData(); fd.append("audio", blob, "hum.webm"); fd.append("genre", $("genre").value);
  const r = await fetch("/analyze", { method: "POST", body: fd });
  if (!r.ok) { $("s1").textContent = (await r.json()).detail; return; }
  const { analysis, prompt } = await r.json();

  $("chips").classList.remove("hidden");
  $("chips").innerHTML = [
    `${analysis.tempo} bpm`, `key ~${analysis.key_center}`, `${analysis.range_semitones} semitone range`, analysis.feel
  ].map(t => `<span class="chip">${t}</span>`).join("");
  showPrompt("prompt1", prompt);
  $("s1").textContent = "Heard you. Composing…";
  await composeAndPlay(prompt);
  $("s1").textContent = "";
};

function showPrompt(id, p) { $(id).classList.remove("hidden"); $(id).textContent = p; }

async function composeAndPlay(prompt) {
  currentPrompt = prompt;
  $("step2").classList.remove("hidden");
  $("s2").textContent = "Composing with ElevenLabs Music… (~20–40s)";
  $("step2").scrollIntoView({ behavior: "smooth" });
  const fd = new FormData(); fd.append("prompt", prompt);
  const r = await fetch("/compose", { method: "POST", body: fd });
  if (!r.ok) { $("s2").textContent = (await r.json()).detail; return; }
  const { url } = await r.json();
  $("player").src = url; $("player").play().catch(()=>{});
  $("s2").textContent = "";
  $("step3").classList.remove("hidden");
}

// ---------- step 3: speak → scribe → revise → compose
$("revBtn").onmousedown = $("revBtn").ontouchstart = async (e) => {
  e.preventDefault();
  const btn = $("revBtn");
  btn.classList.add("rec"); btn.textContent = "🎙 Listening… release to send";
  const blob = await record({ until: holdOn(btn) });
  btn.classList.remove("rec"); btn.textContent = "🎙 Hold to speak";

  $("s3").textContent = "Transcribing…";
  const fd = new FormData(); fd.append("audio", blob, "say.webm"); fd.append("prompt", currentPrompt);
  const r = await fetch("/revise", { method: "POST", body: fd });
  if (!r.ok) { $("s3").textContent = (await r.json()).detail; return; }
  const { heard, prompt } = await r.json();
  $("s3").innerHTML = `Heard: <span class="heard">“${heard}”</span>`;
  showPrompt("prompt3", prompt);
  await composeAndPlay(prompt);
};

$("regenBtn").onclick = () => currentPrompt && composeAndPlay(currentPrompt);
</script>
</body>
</html>
